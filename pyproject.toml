# ---- All project specifications ---- #
[project]
name = "hybrid-diffusion-train"
description = "Training code for HybridDiffusion, built on TorchTitan"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "HybridDiffusion contributors" },
]
keywords = ["pytorch", "training", "diffusion-language-model", "hybrid-diffusion"]
dependencies = [
    # Stateful Dataloader
    "torchdata>=0.8.0",

    # Hugging Face integrations
    "datasets>=2.21.0",
    "transformers",
    "huggingface-hub>=0.34.0,<1.0",
    "safetensors",

    # Tokenization
    "tokenizers",
    # Scientific computing
    "numpy<2.0",

    # Miscellaneous
    "tomli>=1.1.0",
    "tyro",
    "tensorboard",
    "einops",
    "tqdm",
]
dynamic = ["version"]

[project.urls]
Paper = "https://arxiv.org/abs/2606.01774"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "wandb",
    "tomli_w", # test_job_config
    "expecttest", # PyTorch distributed-test utilities
]
train = [
    "wandb",
    "flash-linear-attention",
    "liger-kernel",
    "tilelang",
]
visualization-s3 = [
    "boto3",
]
[tool.setuptools.dynamic]
version = {file = "assets/version.txt"}

[tool.codespell]
skip = ["*.json"]
ignore-words-list = ["assertin", "datas" ,"indx", "inpt", "nd", "socio-economic"]

# ---- Explicit project build information ---- #
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [""]
include = ["torchtitan*"]

[tool.pytest.ini_options]
addopts = ["--showlocals"]  # show local variables in tracebacks
testpaths = ["tests"]

[tool.pyrefly]
project-excludes = ["torchtitan/experiments", "**/tests/**"]
ignore-missing-imports = ["torchao.*", "torchft", "flashoptim", "muon"]  # optional dependencies
search-path = ["../pytorch"]  # local built pytorch

[tool.uv.sources]
flash-linear-attention = { git = "https://github.com/fla-org/flash-linear-attention.git" }
